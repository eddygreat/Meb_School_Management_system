# render.yaml
# This file defines the services for your application on Render.

services:
  - type: web
    name: meb-school-backend # A name for your service on Render
    env: docker
    repo: https://github.com/eddygreat/Meb_School_Management_system # Your GitHub repository URL
    branch: new-deployment # Use the branch you are deploying from
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile

    # This command runs after a new build, but before the new version is deployed.
    # It's the perfect place for database migrations.
    preDeploy:
      command: "alembic upgrade head && python check_db_tables.py"

    # Define how your app starts up
    startCommand: "gunicorn app.main:app --bind 0.0.0.0:$PORT -k uvicorn.workers.UvicornWorker"

    # Define environment variables.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: Meb_School_Management_system_backend # Use the exact name you gave your database on Render
          property: connectionString
      - key: SECRET_KEY
        sync: false # Mark as a secret to be set in the Render dashboard
      - key: BACKEND_CORS_ORIGINS
        value: '["https://mebschoolmanagementsystem.netlify.app", "http://localhost:5173"]' # Replace with your actual frontend URL

databases:
  - name: Meb_School_Management_system_backend
    databaseName: meb_school_db
    user: meb_school_user
    plan: free