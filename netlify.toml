# Netlify configuration file
# This file tells Netlify how to build and deploy your frontend.

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy rule to redirect API requests to your backend.
# This avoids CORS errors in the browser.
[[redirects]]
  from = "/api/*"
  # IMPORTANT: Replace this placeholder with the public URL provided by Railway for your backend service.
  to = "https://your-backend-service-name.up.railway.app/api/:splat"
  status = 200