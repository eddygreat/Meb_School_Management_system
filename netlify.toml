# Netlify configuration file
# This file tells Netlify how to build and deploy your frontend.

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# Configuration for secrets scanning.
# This tells Netlify to ignore the VITE_API_BASE_URL key when scanning for secrets.

[secrets_scanning]
  omit_keys = ["VITE_API_BASE_URL"]

# Proxy rule to redirect API requests to your backend.
# This avoids CORS errors in the browser.
[[redirects]]
  from = "/api/*"
  # IMPORTANT: Replace this placeholder with the public URL provided by Render for your backend service.
  to = "https://meb-school-management-system-1-wkq1.onrender.com/api/:splat"
  status = 200

# Catch-all rule for SPA routing (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200