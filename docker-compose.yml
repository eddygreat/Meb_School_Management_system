
version: '3.9'

ENV DEPLOY_DATE=2025-12-05

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: school_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    # Pass environment variables directly to use the PostgreSQL container.
    # This overrides any .env file.
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:mysecretpassword@db:5432/school_db
      - SECRET_KEY=a_secure_secret_for_local_docker_development
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://localhost:8000"]
    depends_on:
      db:
        condition: service_healthy
    ports: # Map local port 8080 to container port 8000
      - "8080:8000"

volumes:
  db_data:
